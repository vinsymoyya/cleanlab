name: Verify underperforming cluster minimum

on:
  push:
    branches: [verify/underperforming-cluster-minimum]

permissions:
  contents: read

jobs:
  verify:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 1aa72130cf448317976a99885f586e2fd7317cc8
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]" -r requirements-test-core.txt black flake8
      - name: Check changed files
        run: |
          python -m black --check cleanlab/datalab/internal/issue_manager/underperforming_group.py tests/datalab/issue_manager/test_underperforming_group.py
          python -m flake8 cleanlab/datalab/internal/issue_manager/underperforming_group.py tests/datalab/issue_manager/test_underperforming_group.py
      - name: Run affected suite and existing public API tests
        run: python -m pytest -q tests/datalab/issue_manager/test_underperforming_group.py tests/datalab/datalab/test_datalab.py::TestDataLabUnderperformingIssue::test_underperforming_cluster_id tests/datalab/datalab/test_datalab.py::TestDataLabUnderperformingIssue::test_underperforming_clusters_scores --junitxml=verification.xml
      - name: Confirm regressions detect the upstream defect
        shell: python
        run: |
          import pathlib
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          source = pathlib.Path('cleanlab/datalab/internal/issue_manager/underperforming_group.py')
          fixed = source.read_bytes()
          baseline = subprocess.check_output([
              'git', 'show',
              '750625747de1b26d8530954f51f0530bd0b51d3c:' + source.as_posix(),
          ])
          try:
              source.write_bytes(baseline)
              result = subprocess.run([
                  sys.executable, '-m', 'pytest', '-q',
                  'tests/datalab/issue_manager/test_underperforming_group.py',
                  '-k', 'worst_group_is_independent_of_cluster_ids',
                  '--junitxml=baseline.xml',
              ])
              cases = ET.parse('baseline.xml').findall('.//testcase')
              failures = [case for case in cases if case.find('failure') is not None]
              errors = [case for case in cases if case.find('error') is not None]
              skipped = [case for case in cases if case.find('skipped') is not None]
              if (result.returncode != 1 or len(cases) != 4 or len(failures) != 2
                      or errors or skipped
                      or any('group_ids0' not in case.attrib['name'] for case in failures)):
                  raise SystemExit('Baseline did not fail for the two expected regression cases.')
              print('Confirmed: upstream fails both original-ID cases and passes both swapped-ID cases.')
          finally:
              source.write_bytes(fixed)
